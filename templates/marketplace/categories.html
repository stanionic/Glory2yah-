{% extends "base.html" %}
{% block title %}Kategori - Glory2YahPub{% endblock %}

{% block content %}
<style>
.categories-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    padding: 20px;
}

.categories-container {
    max-width: 900px;
    margin: 0 auto;
}

.page-header {
    text-align: center;
    margin-bottom: 32px;
    color: white;
}

.page-header h1 {
    font-size: 32px;
    font-weight: 800;
    margin: 0 0 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.page-header p {
    font-size: 16px;
    opacity: 0.9;
    margin: 0;
}

.categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
}

.category-card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.category-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
}

.category-icon {
    font-size: 48px;
    line-height: 1;
}

.category-name {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
}

@media (max-width: 480px) {
    .categories-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    
    .category-card {
        padding: 20px 16px;
    }
    
    .category-icon {
        font-size: 36px;
    }
}
</style>

<div class="categories-page">
    <div class="categories-container">
        <div class="page-header">
            <h1>📂 Kategori</h1>
            <p>Chwazi yon kategori pou wè pwodwi yo</p>
        </div>
        
        <div class="categories-grid">
            {% for cat in categories %}
            <a href="{{ url_for('marketplace.index', category=cat.id) }}" class="category-card">
                <div class="category-icon">{{ cat.icon }}</div>
                <div class="category-name">{{ cat.name }}</div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
