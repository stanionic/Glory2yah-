{% extends "base.html" %}

{% block title %}Anrejistre kòm Chofè - Glory2YahPub{% endblock %}

{% block content %}
<style>
.mn-wrap { min-height:100vh; padding:22px; background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 40%,#ffedd5 100%); }
.mn-card { background:#fff; border-radius:26px; padding:28px 30px; box-shadow:0 16px 48px rgba(180,83,9,.12); max-width:720px; margin:0 auto }
.mn-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px; align-items:center; margin-bottom:22px }
.mn-ttl { margin:0; font-size:24px; font-weight:900; color:#78350f; display:flex; align-items:center; gap:10px }
.mn-ttl::before { content:"🚗"; font-size:26px }
.mn-sub { color:#b45309; font-size:13px; margin-top:5px; font-weight:600 }
.mn-btn { padding:12px 17px; border-radius:15px; text-decoration:none; font-weight:800; font-size:14px; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .18s ease,box-shadow .18s ease,background .18s; justify-content:center }
.mn-btn-ghost { background:#fef3c7; color:#92400e }
.mn-btn-ghost:hover { background:#fde68a; transform:translateY(-2px) }
.mn-btn-primary { background:linear-gradient(135deg,#d97706,#f59e0b); color:#fff; box-shadow:0 10px 26px rgba(217,119,6,.32); width:100%; padding:16px; font-size:15px; border-radius:18px }
.mn-btn-primary:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(217,119,6,.42) }

.mn-form-box { background:linear-gradient(135deg,#fff,#fffbeb); border:1.5px solid #fed7aa; border-radius:22px; padding:28px; box-shadow:0 8px 28px rgba(180,83,9,.08) }
.mn-field { margin-bottom:18px }
.mn-label { display:block; font-size:13px; font-weight:800; color:#78350f; margin-bottom:8px }
.mn-label small { display:block; font-weight:600; color:#b45309; margin-top:4px; font-size:11.5px; opacity:.85 }
.mn-input, .mn-file {
  width:100%; padding:15px 17px; border-radius:18px;
  border:2px solid #fed7aa; background:#fffbeb;
  color:#78350f; font-size:15px; font-weight:700; transition:all .15s ease;
  box-sizing:border-box;
}
.mn-file { padding:12px 15px; cursor:pointer; background:#fffbeb }
.mn-file::file-selector-button {
  padding:8px 14px; margin-right:12px; border-radius:12px; border:none;
  background:linear-gradient(135deg,#d97706,#f59e0b); color:#fff;
  font-weight:800; font-size:13px; cursor:pointer; box-shadow:0 4px 12px rgba(217,119,6,.26);
  transition:transform .15s;
}
.mn-file::file-selector-button:hover { transform:translateY(-1px) }
.mn-input::placeholder { color:#d97706; opacity:.55; font-weight:600 }
.mn-input:focus, .mn-file:focus {
  outline:none; border-color:#d97706; background:#fff;
  box-shadow:0 0 0 5px rgba(217,119,6,.14);
}

@media(max-width:640px){
  .mn-card { padding:20px 16px }
  .mn-form-box { padding:20px 16px }
  .mn-ttl { font-size:20px }
}
</style>

<div class="mn-wrap">
<div class="mn-card">

    <div class="mn-head">
        <div>
            <h1 class="mn-ttl">Anrejistre kòm Chofè</h1>
            <div class="mn-sub">Rejwenn kliyante nan zòn ou a kounye a</div>
        </div>
        <a href="{{ url_for('mennem.index') }}" class="mn-btn mn-btn-ghost">
            <i class="fas fa-arrow-left"></i> Retounen
        </a>
    </div>

    <div class="mn-form-box">
        <form method="POST" action="{{ url_for('mennem.register_driver') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mn-field">
                <label class="mn-label" for="name">👤 Non Konplè *</label>
                <input type="text" id="name" name="name" required class="mn-input" placeholder="Antre non ou (eg: Jean Dupont)">
            </div>

            <div class="mn-field">
                <label class="mn-label" for="phone">📱 Nimewo WhatsApp *</label>
                <input type="tel" id="phone" name="phone" required class="mn-input" placeholder="egz: +50912345678">
            </div>

            <div class="mn-field">
                <label class="mn-label" for="address">📍 Adrès Kote Ou Ye *
                    <small>Nou itilize adrès sa a pou jwenn kliyante ki pre w.</small>
                </label>
                <input type="text" id="address" name="address" required class="mn-input" placeholder="egz: Delmas 33, Pétion-Ville, Carrefour...">
            </div>

            <div class="mn-field">
                <label class="mn-label" for="photo">📸 Foto Ou (Opsyonal)
                    <small>Kliyante yo ka wè foto ou lè yo chèche yon chofè.</small>
                </label>
                <input type="file" id="photo" name="photo" accept="image/*" class="mn-file">
            </div>

            <button type="submit" class="mn-btn mn-btn-primary">
                <i class="fas fa-user-plus"></i> M'anrejistre Kounye a
            </button>
        </form>
    </div>

</div>
</div>
{% endblock %}
