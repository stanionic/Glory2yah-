{% extends "base.html" %}

{% block title %}Anrejistre kòm Chofè - Glory2YahPub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">🚕 Anrejistre kòm Chofè</h1>
            <p class="text-sm text-gray-500 mt-1">Rejwenn kliyante nan zòn ou a</p>
        </div>
        <a href="{{ url_for('mennem.index') }}" class="mt-4 sm:mt-0 text-sm text-blue-600 hover:text-blue-800 transition-colors duration-200 flex items-center gap-1">
            <i class="fas fa-arrow-left"></i> Retounen
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <form method="POST" action="{{ url_for('mennem.register_driver') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="space-y-6 mb-8">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Non Konplè *</label>
                    <input type="text" id="name" name="name" required class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" 
                           placeholder="Antre non ou">
                </div>
                
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Nimewo WhatsApp *</label>
                    <input type="tel" id="phone" name="phone" required class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" 
                           placeholder="egz: +50912345678">
                </div>
                
                <div>
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-2">Adrès Kote Ou Ye *</label>
                    <input type="text" id="address" name="address" required class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" 
                           placeholder="egz: Delmas 33, Pétion-Ville, etc.">
                    <p class="text-xs text-gray-500 mt-2">Nou itilize adrès sa a pou jwenn kliyante ki pre w.</p>
                </div>
                
                <div>
                    <label for="photo" class="block text-sm font-medium text-gray-700 mb-2">Foto Ou (Opsyonal)</label>
                    <input type="file" id="photo" name="photo" accept="image/*" class="w-full px-5 py-4 border border-gray-200 rounded-2xl bg-gray-50 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-dark">
                    <p class="text-xs text-gray-500 mt-2">Kliyante yo ka wè foto ou lè yo chèche yon chofè.</p>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-primary text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all duration-200 flex items-center justify-center gap-2">
                <i class="fas fa-user-plus"></i> Anrejistre
            </button>
        </form>
    </div>
</div>
{% endblock %}
