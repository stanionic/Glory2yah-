{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="mennenm-register">
        <h2>🚕 Anrejistre kòm Chofè</h2>
        <p class="subtitle">Rejwenn kliyante nan zòn ou a</p>
        
        <form method="POST" action="{{ url_for('mennenm_register') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Non Konplè *</label>
                <input type="text" id="name" name="name" required class="form-control" 
                       placeholder="Antre non ou">
            </div>
            
            <div class="form-group">
                <label for="phone">Nimewo WhatsApp *</label>
                <input type="tel" id="phone" name="phone" required class="form-control" 
                       placeholder="egz: +50912345678">
            </div>
            
            <div class="form-group">
                <label for="address">Adrès Kote Ou Ye *</label>
                <input type="text" id="address" name="address" required class="form-control" 
                       placeholder="egz: Delmas 33, Pétion-Ville, etc.">
                <small class="form-text">Nou itilize adrès sa a pou jwenn kliyante ki pre w.</small>
            </div>
            
            <div class="form-group">
                <label for="photo">Foto Ou (Opsyonal)</label>
                <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
                <small class="form-text">Kliyante yo ka wè foto ou lè yo chèche yon chofè.</small>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Anrejistre
            </button>
        </form>
        
        <div class="back-link">
            <a href="{{ url_for('mennenm_index') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Retounen
            </a>
        </div>
    </div>
</div>

<style>
.mennenm-register {
    max-width: 500px;
    margin: 0 auto;
    padding: 2rem;
}

.mennenm-register h2 {
    text-align: center;
    margin-bottom: 0.5rem;
    color: #333;
}

.mennenm-register .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 2rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
    color: #333;
}

.form-control {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

.form-text {
    display: block;
    margin-top: 0.5rem;
    color: #666;
    font-size: 0.9rem;
}

.btn-block {
    width: 100%;
    padding: 12px;
    font-size: 1.1rem;
    margin-top: 1rem;
}

.back-link {
    text-align: center;
    margin-top: 2rem;
}
</style>
{% endblock %}
