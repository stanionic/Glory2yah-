<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory2YahPub - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #002366 0%, #0B2E8A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            font-weight: 800;
            color: #002366;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #FFD700;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
            opacity: 0.9;
        }
        .offline-features {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .offline-feature {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
        }
        .offline-feature span {
            font-size: 20px;
        }
        .offline-retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #002366;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }
        .offline-retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 215, 0, 0.4);
        }
        .offline-retry-btn:active {
            transform: translateY(0);
        }
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">G</div>
        <h1>Pa gen Koneksyon</h1>
        <p>Glory2YahPub ap retounen otomatikman le koneksyon ou retabli.</p>
        <div class="offline-features">
            <div class="offline-feature">
                <span>🛒</span>
                <span>Marketplace ak tout pwodwi yo</span>
            </div>
            <div class="offline-feature">
                <span>📱</span>
                <span>Rezo sosyal ak piblikasyon ou yo</span>
            </div>
            <div class="offline-feature">
                <span>🪙</span>
                <span>Balans Gkach ou</span>
            </div>
        </div>
        <button class="offline-retry-btn" onclick="window.location.reload()">
            🔄 Rekonekte
        </button>
    </div>
</body>
</html>
