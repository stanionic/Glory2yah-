{% extends "base.html" %}

{% block title %}GADE MATCH - Live Sports{% endblock %}

{% block extra_head %}
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
{% endblock %}

{% block extra_css %}
<style>
/* Hide header, bottom nav, and main content restrictions on GADE MATCH page */
.g2y-header,
.modern-bottom-nav,
#bottomNav {
    display: none !important;
}

.g2y-main {
    padding: 0 !important;
    margin: 0 !important;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 1 !important;
}

.g2y-body {
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
    touch-action: none;
}

.gadematch-container {
    position: fixed;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background-color: black !important;
    display: flex;
    flex-direction: column;
    z-index: 999999 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    width: 100vw;
    height: 100vh;
}

.gadematch-video-container {
    flex-grow: 1;
    width: 100% !important;
    height: 100% !important;
    position: relative;
    background-color: black !important;
    display: none;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
}

.gadematch-video-container iframe {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
}

.gadematch-play-container {
    flex-grow: 1;
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 20px;
}

.gadematch-play-button {
    padding: 30px 50px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    border: none;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    max-width: 100%;
    -webkit-tap-highlight-color: transparent;
}

.gadematch-play-button:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
}

.gadematch-play-button:active {
    transform: scale(0.98);
}

.gadematch-play-button svg {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
}

.hidden {
    display: none !important;
}

/* Fullscreen button */
.gadematch-fullscreen-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 24px;
    cursor: pointer;
    z-index: 1000000;
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    display: none;
    -webkit-tap-highlight-color: transparent;
}

.gadematch-fullscreen-btn:active {
    transform: scale(0.95);
}

/* Reset button */
.gadematch-reset-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: linear-gradient(135deg, rgba(239,68,68,0.85) 0%, rgba(220,38,38,0.7) 100%);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000000;
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    display: none;
    -webkit-tap-highlight-color: transparent;
}

.gadematch-reset-btn:active {
    transform: scale(0.95);
}

/* Auto-rotate support */
@media screen and (orientation: portrait) {
    .gadematch-video-container,
    .gadematch-play-container {
        width: 100%;
        height: 100%;
    }
}

@media screen and (orientation: landscape) {
    .gadematch-video-container,
    .gadematch-play-container {
        width: 100%;
        height: 100%;
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .gadematch-play-button {
        padding: 25px 40px;
        font-size: 22px;
        gap: 12px;
    }
    
    .gadematch-play-button svg {
        width: 60px;
        height: 60px;
    }
}

@media (max-width: 480px) {
    .gadematch-play-button {
        padding: 20px 30px;
        font-size: 18px;
        gap: 10px;
        flex-direction: column;
    }
    
    .gadematch-play-button svg {
        width: 50px;
        height: 50px;
    }
}

@media (max-height: 600px) {
    .gadematch-play-button {
        padding: 15px 25px;
        font-size: 16px;
        gap: 8px;
    }
    
    .gadematch-play-button svg {
        width: 40px;
        height: 40px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="gadematch-container">
    <!-- Timer Display -->
    <div id="timerDisplay" class="gadematch-timer" style="
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%);
        color: white;
        padding: 14px 22px;
        border-radius: 16px;
        font-size: 18px;
        font-weight: 800;
        z-index: 10000;
        display: none;
        backdrop-filter: blur(12px);
        border: 2px solid rgba(255,255,255,0.3);
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    ">
        <span id="timerText">TAN KI RETE POU W' HT GKACH: 45 min</span>
    </div>
    
    <!-- Video Player Section - FULL SCREEN -->
    <div id="videoPlayerContainer" class="gadematch-video-container">
        <iframe
            id="gadematchIframe"
            src=""
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            playsinline
        ></iframe>
    </div>

    <div id="playStreamButtonContainer" class="gadematch-play-container">
        <button id="playStreamButton" class="gadematch-play-button">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <span>PLAY</span>
        </button>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button id="fullscreenBtn" class="gadematch-fullscreen-btn" title="Fullscreen">⛶</button>
    <!-- Reset Button -->
    <button id="resetBtn" class="gadematch-reset-btn" title="Reset">RESET</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const playStreamButton = document.getElementById('playStreamButton');
    const playStreamButtonContainer = document.getElementById('playStreamButtonContainer');
    const videoPlayerContainer = document.getElementById('videoPlayerContainer');
    const gadematchIframe = document.getElementById('gadematchIframe');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerText = document.getElementById('timerText');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Timer variables
    let startTime = null;
    let timerInterval = null;
    const MAX_TIME = 45 * 60; // 45 minutes in seconds

    // Check if user is logged in (from template variable)
    const isLoggedIn = {{ is_logged_in | tojson }};

    // Get the appropriate fullscreen element
    function getFullscreenElement() {
        return document.fullscreenElement || 
               document.webkitFullscreenElement || 
               document.mozFullScreenElement || 
               document.msFullscreenElement;
    }

    // Request fullscreen with better mobile support
    async function requestFullScreen(elem) {
        try {
            if (!elem) {
                elem = document.documentElement;
            }

            // Try all fullscreen methods
            if (elem.requestFullscreen) {
                await elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                await elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                await elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                await elem.msRequestFullscreen();
            }
        } catch (e) {
            console.log('Fullscreen request failed:', e);
            // If container fails, try document element
            if (elem !== document.documentElement) {
                requestFullScreen(document.documentElement);
            }
        }
    }

    // Exit fullscreen
    async function exitFullScreen() {
        try {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                await document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                await document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                await document.msExitFullscreen();
            }
        } catch (e) {
            console.log('Exit fullscreen failed:', e);
        }
    }

    // Toggle fullscreen
    async function toggleFullScreen() {
        if (getFullscreenElement()) {
            await exitFullScreen();
        } else {
            await requestFullScreen(videoPlayerContainer || document.documentElement);
        }
    }

    // Update fullscreen button text/icon
    function updateFullscreenButton() {
        if (fullscreenBtn) {
            if (getFullscreenElement()) {
                fullscreenBtn.textContent = '⛶';
            } else {
                fullscreenBtn.textContent = '⛶';
            }
        }
    }

    // Timer functions
    function startTimer() {
        // Only show timer if user is not logged in
        if (isLoggedIn) return;
        
        // Get or set start time in localStorage
        let stored = localStorage.getItem('gadematch_start');
        if (!stored) {
            stored = Date.now();
            localStorage.setItem('gadematch_start', stored);
        }
        startTime = parseInt(stored);
        
        // Show timer display
        timerDisplay.style.display = 'block';
        
        // Update timer immediately and then every second
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        if (!startTime) return;
        
        const elapsed = (Date.now() - startTime) / 1000; // in seconds
        const remaining = MAX_TIME - elapsed;
        
        if (remaining <= 0) {
            // Time's up - redirect to login
            clearInterval(timerInterval);
            timerText.textContent = 'Tan fini!';
            timerDisplay.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
            
            // Show message and redirect after 3 seconds
            setTimeout(() => {
                window.location.href = '/auth/login?next=/gadematch';
            }, 3000);
            return;
        }
        
        // Update timer text
        const minutes = Math.floor(remaining / 60);
        const seconds = Math.floor(remaining % 60);
        timerText.textContent = `TAN KI RETE POU W' HT GKACH: ${minutes}m ${seconds}s`;
        
        // Change color when time is running low (5 minutes left)
        if (remaining < 300) {
            timerDisplay.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
        } else if (remaining < 600) {
            timerDisplay.style.background = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
        }
    }

    // Check if stream is already playing (for refresh)
    const savedSrc = localStorage.getItem('gadematch_src');
    if (savedSrc && savedSrc !== '') {
        gadematchIframe.src = savedSrc;
        playStreamButtonContainer.classList.add('hidden');
        videoPlayerContainer.style.display = 'flex';
        fullscreenBtn.style.display = 'block';
        resetBtn.style.display = 'block';
    }

    // Save src to localStorage when play button is clicked
    if (playStreamButton) {
        playStreamButton.addEventListener('click', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Load the stream
            const streamUrl = 'https://famelack.com/tv/ht/9dYnjnGkh6Gk0r?autoplay=1';
            gadematchIframe.src = streamUrl;
            localStorage.setItem('gadematch_src', streamUrl);
            
            // Hide play button
            playStreamButtonContainer.classList.add('hidden');
            videoPlayerContainer.style.display = 'flex';
            fullscreenBtn.style.display = 'block';
            resetBtn.style.display = 'block';
            
            // Start timer
            startTimer();
            
            // Try to enter full screen
            setTimeout(() => {
                requestFullScreen(videoPlayerContainer || document.documentElement);
            }, 100);
        });
    }

    // Fullscreen button listener
    if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleFullScreen();
        });
    }

    // Reset button listener
    if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            // Clear localStorage
            localStorage.removeItem('gadematch_src');
            localStorage.removeItem('gadematch_start');
            // Reset iframe
            gadematchIframe.src = '';
            // Show play button
            playStreamButtonContainer.classList.remove('hidden');
            videoPlayerContainer.style.display = 'none';
            fullscreenBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            // Hide timer
            timerDisplay.style.display = 'none';
            if (timerInterval) {
                clearInterval(timerInterval);
            }
        });
    }

    // Show reset button when video is playing
    if (videoPlayerContainer.style.display === 'flex' || videoPlayerContainer.style.display === '') {
        if (resetBtn) {
            resetBtn.style.display = 'block';
        }
    }

    // Listen for fullscreen changes
    document.addEventListener('fullscreenchange', function() {
        updateFullscreenButton();
    });
    document.addEventListener('webkitfullscreenchange', function() {
        updateFullscreenButton();
    });
    document.addEventListener('mozfullscreenchange', function() {
        updateFullscreenButton();
    });
    document.addEventListener('MSFullscreenChange', function() {
        updateFullscreenButton();
    });

    // Start timer immediately if page is loaded (in case user refreshes)
    if (!isLoggedIn) {
        startTimer();
    }

    // Check if stream is already playing (for refresh)
    if (gadematchIframe && gadematchIframe.src && gadematchIframe.src !== '') {
        playStreamButtonContainer.classList.add('hidden');
        videoPlayerContainer.style.display = 'flex';
        fullscreenBtn.style.display = 'block';
    }
});
</script>
{% endblock %}
