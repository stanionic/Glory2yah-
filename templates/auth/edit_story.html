{% extends "base.html" %}

{% block title %}Modifye Istwa - Glory2YahPub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">Modifye Istwa</h1>
            <p class="text-sm text-gray-500">Chanje detay istwa ou a</p>
        </div>
        <a href="{{ url_for('auth.my_stories') }}" class="text-sm text-gray-500 hover:text-gray-700">
            ← Retounen nan lis la
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Tit</label>
                <input type="text" name="title" value="{{ story.title }}" required minlength="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Deskripsyon</label>
                <textarea name="description" required minlength="10" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">{{ story.description }}</textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Pri (Gkach)</label>
                <input type="number" name="price_gkach" value="{{ story.price_gkach }}" min="0" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div class="flex gap-3">
                <button type="submit" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold hover:bg-primary/90 transition">
                    <i class="fas fa-save mr-2"></i>Sove Chanjman
                </button>
                <a href="{{ url_for('auth.my_stories') }}" class="px-6 py-3 bg-gray-50 text-gray-600 rounded-xl font-bold border border-gray-100 hover:bg-gray-100 transition">
                    Anile
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
