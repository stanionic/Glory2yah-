{% extends "base.html" %}

{% block title %}Modifye Pwofil - Glory2YahPub{% endblock %}

{% block content %}
<style>
.edit-profile-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    padding: 20px;
}

.edit-profile-card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 30px;
    animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
}

.page-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    margin: 0;
}

.page-header p {
    font-size: 14px;
    color: #6b7280;
    margin: 4px 0 0;
}

.back-btn {
    padding: 10px 20px;
    background: #f3f4f6;
    color: #4b5563;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: #e5e7eb;
    transform: translateX(-2px);
}

.form-group {
    margin-bottom: 24px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 10px;
}

.form-input,
.form-textarea {
    width: 100%;
    padding: 16px 18px;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    font-size: 15px;
    background: #f9fafb;
    color: #1a1a1a;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.form-input:focus,
.form-textarea:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.form-textarea {
    resize: vertical;
    min-height: 120px;
    line-height: 1.6;
}

.file-input {
    width: 100%;
    padding: 16px;
    border: 2px dashed #d1d5db;
    border-radius: 16px;
    background: #f9fafb;
    cursor: pointer;
    transition: all 0.3s ease;
}

.file-input:hover {
    border-color: #667eea;
    background: #f3f4f6;
}

.form-actions {
    display: flex;
    gap: 16px;
    margin-top: 32px;
}

.save-btn {
    flex: 1;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 16px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
}

.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
}

.cancel-btn {
    padding: 16px 32px;
    background: #f3f4f6;
    color: #4b5563;
    text-decoration: none;
    border-radius: 16px;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.3s ease;
    border: 2px solid #e5e7eb;
}

.cancel-btn:hover {
    background: #e5e7eb;
}

@media (max-width: 768px) {
    .edit-profile-card {
        padding: 32px 20px;
    }
    
    .page-header {
        flex-direction: column;
        gap: 16px;
        text-align: center;
    }
    
    .back-btn {
        width: 100%;
        text-align: center;
    }
    
    .form-actions {
        flex-direction: column;
    }
    
    .cancel-btn {
        text-align: center;
    }
}
</style>

<div class="edit-profile-page">
    <div class="edit-profile-card">
        <!-- Header -->
        <div class="page-header">
            <div>
                <h1>Modifye Pwofil</h1>
                <p>Chanje detay kont ou a</p>
            </div>
            <a href="{{ url_for('auth.profile') }}" class="back-btn">
                ← Retounen nan pwofil
            </a>
        </div>

        <!-- Form -->
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label>Non</label>
                <input type="text" name="name" value="{{ user.name or '' }}" class="form-input">
            </div>
            
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" rows="4" class="form-textarea">{{ user.bio or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label>Foto Pwofil</label>
                <input type="file" name="profile_photo" accept="image/*" class="file-input">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="save-btn">
                    💾 Sove Chanjman
                </button>
                <a href="{{ url_for('auth.profile') }}" class="cancel-btn">
                    Anile
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
