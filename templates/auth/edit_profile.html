{% extends "base.html" %}

{% block title %}Modifye Pwofil - Glory2YahPub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">Modifye Pwofil</h1>
            <p class="text-sm text-gray-500">Chanje detay kont ou a</p>
        </div>
        <a href="{{ url_for('auth.profile') }}" class="text-sm text-gray-500 hover:text-gray-700">
            ← Retounen nan pwofil
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Non</label>
                <input type="text" name="name" value="{{ user.name or '' }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
                <textarea name="bio" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">{{ user.bio or '' }}</textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Foto Pwofil</label>
                <input type="file" name="profile_photo" accept="image/*" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>
            
            <div class="flex gap-3">
                <button type="submit" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold hover:bg-primary/90 transition">
                    <i class="fas fa-save mr-2"></i>Sove Chanjman
                </button>
                <a href="{{ url_for('auth.profile') }}" class="px-6 py-3 bg-gray-50 text-gray-600 rounded-xl font-bold border border-gray-100 hover:bg-gray-100 transition">
                    Anile
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
