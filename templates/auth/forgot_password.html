{% extends "base.html" %}

{% block title %}Rekipere Modpas - Glory2YahPub{% endblock %}

{% block content %}
<style>
.forgot-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.forgot-card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 420px;
    padding: 40px 30px;
    animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.forgot-header {
    text-align: center;
    margin-bottom: 36px;
}

.forgot-logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
}

.forgot-title {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
    margin: 0 0 8px;
}

.forgot-subtitle {
    font-size: 15px;
    color: #65676b;
    margin: 0;
}

.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 10px;
}

.form-input {
    width: 100%;
    padding: 16px 18px;
    font-size: 15px;
    border: 2px solid #e4e6eb;
    border-radius: 16px;
    background: #f8f9fa;
    color: #1a1a1a;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.form-input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.form-input::placeholder {
    color: #a0a3a8;
}

.submit-button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
}

.submit-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
}

.submit-button:active {
    transform: translateY(0);
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: #65676b;
    text-decoration: none;
    font-weight: 600;
}

.back-link:hover {
    color: #667eea;
    text-decoration: underline;
}

@media (max-width: 480px) {
    .forgot-card {
        padding: 32px 24px;
        border-radius: 24px;
    }
    
    .forgot-title {
        font-size: 24px;
    }
    
    .form-input {
        padding: 14px 16px;
    }
}
</style>

<div class="forgot-page">
    <div class="forgot-card">
        <div class="forgot-header">
            <div class="forgot-logo">🔐</div>
            <h1 class="forgot-title">Rekipere modpas ou</h1>
            <p class="forgot-subtitle">N ap voye yon kòd sekirite sou WhatsApp kont ou.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="send_code">
            <div class="form-group">
                <label for="identifier" class="form-label">WhatsApp oswa Pseudo</label>
                <input id="identifier" name="identifier" type="text" required
                       class="form-input" autocomplete="username"
                       placeholder="Antre WhatsApp ou oswa pseudo">
            </div>
            <div class="form-group">
                <button type="submit" class="submit-button">Voye kòd sekirite a</button>
            </div>
        </form>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="reset_password">
            <div class="form-group">
                <label for="code" class="form-label">Kòd OTP 6 chif</label>
                <input id="code" name="code" type="text" required inputmode="numeric"
                       pattern="[0-9]{6}" maxlength="6" class="form-input"
                       autocomplete="one-time-code">
            </div>
            <div class="form-group">
                <label for="new_password" class="form-label">Nouvo modpas</label>
                <input id="new_password" name="new_password" type="password" required
                       minlength="4" maxlength="128" class="form-input"
                       autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password" class="form-label">Konfime nouvo modpas la</label>
                <input id="confirm_password" name="confirm_password" type="password" required
                       minlength="4" maxlength="128" class="form-input"
                       autocomplete="new-password">
            </div>
            <div class="form-group">
                <button type="submit" class="submit-button">Verifye kòd la epi chanje modpas</button>
            </div>
        </form>

        <a href="{{ url_for('auth.login') }}" class="back-link">← Retounen nan paj koneksyon</a>
    </div>
</div>
{% endblock %}
