{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/konferans.css">
<style>
    /* Override base template main padding for full-screen room */
    main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
    }

    .konf-room-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 16px;
        min-height: calc(100vh - 60px);
    }

    .konf-main-area {
        display: flex;
        flex-direction: column;
    }

    .konf-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .konf-room-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .konf-room-info h3 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
    }

    .konf-room-code {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(255,255,255,0.1);
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: rgba(255,255,255,0.8);
        border: 1px solid rgba(255,255,255,0.1);
    }

    .konf-room-code i {
        color: var(--g2y-primary-light);
    }

    .konf-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
    }

    .konf-status-badge.recording {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
        animation: konfPulse 1.5s infinite;
    }

    .konf-status-badge.eco {
        background: rgba(234, 179, 8, 0.15);
        border: 1px solid rgba(234, 179, 8, 0.3);
        color: #facc15;
    }

    .konf-status-badge.hd {
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #60a5fa;
    }

    .konf-status-badge.uhd {
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #4ade80;
    }

    /* Chat panel in sidebar */
    .konf-chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 300px;
    }

    .konf-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        max-height: 350px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .konf-chat-messages::-webkit-scrollbar {
        width: 4px;
    }
    .konf-chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    .konf-chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
    }

    /* Participants panel */
    .konf-participants {
        max-height: 200px;
        overflow-y: auto;
    }

    .konf-participants::-webkit-scrollbar {
        width: 4px;
    }
    .konf-participants::-webkit-scrollbar-track {
        background: transparent;
    }
    .konf-participants::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
    }

    /* Responsive */
    @media (max-width: 992px) {
        .konf-room-layout {
            grid-template-columns: 1fr;
        }
        .konf-sidebar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
    }

    @media (max-width: 768px) {
        .konf-room-layout {
            grid-template-columns: 1fr;
        }
        .konf-sidebar {
            grid-template-columns: 1fr;
        }
        .konf-room-header {
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }
        .konf-video-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 480px) {
        .konf-room-container {
            padding: 8px;
        }
        .konf-controls-bar {
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            justify-content: flex-start;
        }
        .konf-ctrl-btn span:not(.konf-ctrl-icon) {
            display: none;
        }
        .konf-ctrl-btn {
            padding: 10px;
            min-width: 44px;
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<body class="konf-room-body">
<div class="konf-room-container">
    <!-- Room Header -->
    <div class="konf-room-header">
        <div class="konf-room-info">
            <div class="konf-room-name">
                <i class="fas fa-video"></i> {{ room.room_name }}
            </div>
            <span class="konf-room-code">
                <i class="fas fa-key"></i> {{ room.room_code }}
            </span>
        </div>
        <div class="konf-room-controls-top">
            <div id="recordingStatus" style="display: none;">
                <span class="konf-status-badge recording">
                    <span class="konf-recording-dot"></span> Anrejistreman ap mache
                </span>
            </div>
            <div id="qualityStatus" class="konf-status-badge eco">
                <i class="fas fa-signal"></i> Mode Économique (Faible débit)
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="konf-room-layout">
        <!-- Main Area: Video Grid + Controls -->
        <div class="konf-main-area">
            <!-- Video Grid -->
            <div class="konf-video-grid" id="videoContainer">
                <!-- Videos will be added here dynamically -->
            </div>

            <!-- Controls Bar -->
            <div class="konf-controls-bar">
                <!-- Quality Dropdown -->
                <div class="konf-quality-dropdown">
                    <button class="konf-ctrl-btn konf-ctrl-secondary">
                        <i class="fas fa-cog"></i> <span>Kalite</span>
                    </button>
                    <div class="konf-quality-menu">
                        <a class="konf-quality-item" href="#" onclick="changeQuality('low')">
                            <i class="fas fa-signal text-warning"></i> Eko (360p)
                        </a>
                        <a class="konf-quality-item" href="#" onclick="changeQuality('hd')">
                            <i class="fas fa-tv text-primary"></i> HD (720p)
                        </a>
                        <a class="konf-quality-item" href="#" onclick="changeQuality('uhd')">
                            <i class="fas fa-film text-success"></i> UHD (1080p)
                        </a>
                    </div>
                </div>

                <button id="toggleVideo" class="konf-ctrl-btn konf-ctrl-primary" title="Aktive/Dezaktive Kamera">
                    <i class="fas fa-video"></i> <span>Video</span>
                </button>

                <button id="toggleAudio" class="konf-ctrl-btn konf-ctrl-primary" title="Aktive/Dezaktive Mikwo">
                    <i class="fas fa-microphone"></i> <span>Odio</span>
                </button>

                {% if is_owner %}
                <button id="startRecording" class="konf-ctrl-btn konf-ctrl-danger" title="Kòmanse anrejistreman">
                    <i class="fas fa-circle"></i> <span>Anrejistre</span>
                </button>
                <button id="stopRecording" class="konf-ctrl-btn konf-ctrl-secondary" style="display: none;" title="Sispann anrejistreman">
                    <i class="fas fa-stop"></i> <span>Sispann</span>
                </button>
                <button id="shareScreen" class="konf-ctrl-btn konf-ctrl-info" title="Pataje ekran">
                    <i class="fas fa-desktop"></i> <span>Pataje</span>
                </button>
                {% endif %}

                <button id="leaveRoom" class="konf-ctrl-btn konf-ctrl-danger" style="margin-left: auto;" title="Kite sal la">
                    <i class="fas fa-sign-out-alt"></i> <span>Kite</span>
                </button>
            </div>
        </div>

        <!-- Sidebar: Chat + Participants -->
        <div class="konf-sidebar">
            <!-- Chat Panel -->
            <div class="konf-chat-panel">
                <div class="konf-chat-header">
                    <i class="fas fa-comments"></i> Chat
                </div>
                <div class="konf-chat-messages" id="chatContainer">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="konf-chat-input-area">
                    <input type="text" id="chatInput" class="konf-chat-input" placeholder="Tape mesaj ou...">
                    <button id="sendChat" class="konf-chat-send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Participants Panel -->
            <div class="konf-participants">
                <div class="konf-participants-header">
                    <i class="fas fa-users"></i> Patisipan yo
                </div>
                <div class="konf-participants-list" id="participantsList">
                    <!-- Participants will be listed here -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
<script>
    const roomId = '{{ room.room_id }}';
    const userName = '{{ user_name }}';
    const isOwner = {{ is_owner|tojson }};
    const socket = io();

    const videoContainer = document.getElementById('videoContainer');
    const chatContainer = document.getElementById('chatContainer');
    const participantsList = document.getElementById('participantsList');
    
    let localStream;
    const peers = {}; // sid -> {peer, userName}

    const qualityProfiles = {
        low: {
            video: { width: { ideal: 320, max: 480 }, height: { ideal: 240, max: 360 }, frameRate: { ideal: 15, max: 15 } },
            label: '<i class="fas fa-signal"></i> Mode Économique (Faible débit)',
            class: 'eco'
        },
        hd: {
            video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
            label: '<i class="fas fa-tv"></i> Mode HD (720p)',
            class: 'hd'
        },
        uhd: {
            video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
            label: '<i class="fas fa-film"></i> Mode UHD (1080p)',
            class: 'uhd'
        }
    };

    let currentQuality = 'low';

    async function changeQuality(level) {
        if (currentQuality === level) return;
        
        try {
            const profile = qualityProfiles[level];
            const newStream = await navigator.mediaDevices.getUserMedia({
                video: profile.video,
                audio: true
            });

            const oldVideoTrack = localStream.getVideoTracks()[0];
            const newVideoTrack = newStream.getVideoTracks()[0];

            // Replace track for all existing peers
            for (let peerId in peers) {
                const p = peers[peerId].peer;
                p.replaceTrack(oldVideoTrack, newVideoTrack, localStream);
            }

            // Update local stream
            localStream.removeTrack(oldVideoTrack);
            localStream.addTrack(newVideoTrack);
            oldVideoTrack.stop(); // Stop old camera

            // Update local video preview
            const localVideo = document.querySelector('#video-local video');
            if (localVideo) localVideo.srcObject = localStream;

            // Update Status Indicator
            const statusDiv = document.getElementById('qualityStatus');
            if (statusDiv) {
                statusDiv.className = `konf-status-badge ${profile.class}`;
                statusDiv.innerHTML = profile.label;
            }

            currentQuality = level;
            console.log(`Switched to ${level} quality`);

        } catch (err) {
            console.error("Error switching quality:", err);
            alert("Erè: Kamera pa sipòte kalite sa a oubyen li pa aksesib.");
        }
    }

    // Initialize User Media
    navigator.mediaDevices.getUserMedia({
        video: qualityProfiles.low.video,
        audio: { echoCancellation: true, noiseSuppression: true }
    }).then(stream => {
        localStream = stream;
        addVideoStream('local', stream, userName + " (Ou)");
        
        // Emit join event AFTER getting media
        socket.emit('join', { room_id: roomId, user_name: userName });
    }).catch(err => {
        console.error("Error accessing media:", err);
        alert("Erè: Pa ka jwenn aksè ak kamera/mikwofòn. Tanpri verifye pèmisyon yo.");
    });

    // --- Socket Events ---

    socket.on('all_users', (users) => {
        console.log('Received existing users:', users);
        users.forEach(user => {
            createPeer(user.sid, socket.id, true, user.user_name);
        });
    });

    socket.on('user_joined_signal', (payload) => {
        console.log('Received signal from:', payload.caller_id);
        const item = peers[payload.caller_id];
        
        if (item) {
            item.peer.signal(payload.signal);
        } else {
            const p = createPeer(payload.caller_id, socket.id, false, payload.user_name);
            p.signal(payload.signal);
        }
    });

    socket.on('user_joined', (data) => {
        console.log('New user joined:', data);
        addChatMessage('System', `${data.user_name} rantre nan sal la`, false, true);
        updateParticipantsList(data.participants);
    });

    socket.on('user_left', (data) => {
        console.log('User left:', data);
        if (peers[data.sid]) {
            peers[data.sid].peer.destroy();
            delete peers[data.sid];
        }
        removeVideoStream(data.sid);
        updateParticipantsList(data.participants);
        addChatMessage('System', `${data.user_name} kite sal la`, false, true);
    });

    socket.on('chat_message', (data) => {
        addChatMessage(data.user_name, data.message, data.user_name === userName);
    });

    // --- WebRTC Helper Functions ---

    function createPeer(userToSignal, callerID, initiator, peerName) {
        const peer = new SimplePeer({
            initiator: initiator,
            trickle: true,
            stream: localStream,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('signal', signal => {
            socket.emit('sending_signal', {
                user_to_signal: userToSignal,
                caller_id: callerID,
                signal: signal,
                room_id: roomId
            });
        });

        peer.on('stream', stream => {
            console.log('Received stream from:', peerName);
            addVideoStream(userToSignal, stream, peerName);
        });
        
        peer.on('error', err => {
             console.error('Peer error:', err);
        });

        peers[userToSignal] = { peer: peer, userName: peerName };
        return peer;
    }

    function addVideoStream(id, stream, name) {
        if (document.getElementById(`video-${id}`)) return;

        const wrapper = document.createElement('div');
        wrapper.className = 'konf-video-wrapper';
        wrapper.id = `video-${id}`;

        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.playsInline = true;
        if (id === 'local') video.muted = true;

        const label = document.createElement('div');
        label.className = 'konf-video-label';
        label.innerText = name;

        wrapper.appendChild(video);
        wrapper.appendChild(label);
        videoContainer.appendChild(wrapper);
    }

    function removeVideoStream(id) {
        const el = document.getElementById(`video-${id}`);
        if (el) el.remove();
    }

    function updateParticipantsList(participants) {
        participantsList.innerHTML = '';
        participants.forEach(p => {
            const div = document.createElement('div');
            div.className = 'konf-participant-item';
            const initial = p.charAt(0).toUpperCase();
            div.innerHTML = `
                <div class="konf-participant-avatar">${initial}</div>
                <span class="konf-participant-name">${p}</span>
                <span class="konf-participant-status"></span>
            `;
            participantsList.appendChild(div);
        });
    }

    function addChatMessage(sender, msg, isOwn = false, isSystem = false) {
        const div = document.createElement('div');
        if (isSystem) {
            div.className = 'konf-chat-bubble konf-chat-system';
            div.innerText = msg;
        } else if (isOwn) {
            div.className = 'konf-chat-bubble konf-chat-own';
            div.innerHTML = `<div class="konf-chat-sender">${sender}</div>${msg}`;
        } else {
            div.className = 'konf-chat-bubble konf-chat-other';
            div.innerHTML = `<div class="konf-chat-sender">${sender}</div>${msg}`;
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // --- Event Listeners ---
    
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendChat');

    function sendChat() {
        const msg = chatInput.value.trim();
        if(msg) {
            socket.emit('chat_message', { room_id: roomId, user_name: userName, message: msg });
            chatInput.value = '';
        }
    }

    sendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendChat(); });

    document.getElementById('toggleVideo').addEventListener('click', function() {
        const track = localStream.getVideoTracks()[0];
        track.enabled = !track.enabled;
        this.classList.toggle('konf-ctrl-danger');
        this.classList.toggle('konf-ctrl-primary');
        this.innerHTML = track.enabled ? '<i class="fas fa-video"></i> <span>Video</span>' : '<i class="fas fa-video-slash"></i> <span>Video</span>';
    });

    document.getElementById('toggleAudio').addEventListener('click', function() {
        const track = localStream.getAudioTracks()[0];
        track.enabled = !track.enabled;
        this.classList.toggle('konf-ctrl-danger');
        this.classList.toggle('konf-ctrl-primary');
        this.innerHTML = track.enabled ? '<i class="fas fa-microphone"></i> <span>Odio</span>' : '<i class="fas fa-microphone-slash"></i> <span>Odio</span>';
    });

    document.getElementById('leaveRoom').addEventListener('click', () => {
        if(confirm('Èske ou vle kite konferans sa a?')) {
            window.location.href = '/konferans/';
        }
    });

    // Screen Share Logic
    let screenStream = null;
    let originalVideoTrack = null;
    let isScreenSharing = false;

    const shareScreenBtn = document.getElementById('shareScreen');
    if (shareScreenBtn) {
        shareScreenBtn.addEventListener('click', async () => {
            if (isScreenSharing) {
                stopScreenShare();
            } else {
                startScreenShare();
            }
        });
    }

    async function startScreenShare() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const screenTrack = screenStream.getVideoTracks()[0];
            originalVideoTrack = localStream.getVideoTracks()[0];

            for (let peerId in peers) {
                peers[peerId].peer.replaceTrack(originalVideoTrack, screenTrack, localStream);
            }

            localStream.removeTrack(originalVideoTrack);
            localStream.addTrack(screenTrack);

            const localVideo = document.querySelector('#video-local video');
            if (localVideo) localVideo.srcObject = screenStream;

            shareScreenBtn.classList.replace('konf-ctrl-info', 'konf-ctrl-danger');
            shareScreenBtn.innerHTML = '<i class="fas fa-stop-circle"></i> <span>Sispann</span>';
            isScreenSharing = true;

            screenTrack.onended = () => stopScreenShare();
        } catch (err) {
            console.error("Error screen sharing:", err);
        }
    }

    function stopScreenShare() {
        const screenTrack = screenStream.getVideoTracks()[0];
        screenTrack.stop();

        for (let peerId in peers) {
            peers[peerId].peer.replaceTrack(screenTrack, originalVideoTrack, localStream);
        }

        localStream.removeTrack(screenTrack);
        localStream.addTrack(originalVideoTrack);

        const localVideo = document.querySelector('#video-local video');
        if (localVideo) localVideo.srcObject = localStream;

        shareScreenBtn.classList.replace('konf-ctrl-danger', 'konf-ctrl-info');
        shareScreenBtn.innerHTML = '<i class="fas fa-desktop"></i> <span>Pataje</span>';
        isScreenSharing = false;
        screenStream = null;
    }
</script>
</body>
{% endblock %}
