ake it {% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/konferans.css?v=2">
<style>
    /* Additional modern styles for the index page */
    .konf-hero-icon {
        font-size: 3.5rem;
        margin-bottom: 8px;
        display: block;
        animation: g2y-float 6s ease-in-out infinite;
    }

    .konf-subtitle {
        color: rgba(255,255,255,0.85);
        font-size: 1rem;
        margin-top: 4px;
        font-weight: 400;
    }

    .konf-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 24px 0;
        color: var(--g2y-text-muted);
        font-size: 0.85rem;
        font-weight: 600;
    }

    .konf-divider::before,
    .konf-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--g2y-border);
    }

    .konf-input-icon {
        position: relative;
    }

    .konf-input-icon .form-control {
        padding-left: 40px;
    }

    .konf-input-icon i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--g2y-text-muted);
        font-size: 1rem;
        pointer-events: none;
    }

    .konf-btn-outline {
        background: transparent;
        border: 2px solid var(--g2y-border);
        color: var(--g2y-text);
    }

    .konf-btn-outline:hover {
        border-color: var(--g2y-primary-light);
        color: var(--g2y-primary-light);
        background: rgba(74, 111, 199, 0.05);
    }

    .konf-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--g2y-border);
    }

    .konf-feature-item {
        text-align: center;
        padding: 12px 8px;
        border-radius: 12px;
        background: var(--g2y-bg-alt);
        transition: var(--g2y-transition);
    }

    .konf-feature-item:hover {
        background: var(--g2y-card-hover);
        transform: translateY(-2px);
    }

    .konf-feature-item i {
        font-size: 1.5rem;
        color: var(--g2y-primary-light);
        margin-bottom: 6px;
        display: block;
    }

    .konf-feature-item span {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--g2y-text-secondary);
        display: block;
    }

    @media (max-width: 480px) {
        .konf-features {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="konferans-page">
    <div class="konferans-container">
        <div class="konferans-card">
            <div class="konferans-card-header">
                <span class="konf-hero-icon">🎥</span>
                <h3>Konferans</h3>
                <p class="konf-subtitle">Sal Konferans Videyo Glory2Yah</p>
            </div>
            <div class="konferans-card-body">
                <!-- Create Room Section -->
                <div class="konferans-section-title">
                    <i class="fas fa-plus-circle"></i> Kreye yon Sal
                </div>
                
                <div class="konf-form-group">
                    <label for="create_room_name">Non Sal la</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-door-open"></i>
                        <input type="text" id="create_room_name" class="form-control" placeholder="Egz: Reyinyon Fanmi">
                    </div>
                </div>
                
                <div class="konf-form-group">
                    <label for="create_user_name">Non w</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="create_user_name" class="form-control" placeholder="Egz: Jean Philippe">
                    </div>
                </div>
                
                <div class="konf-form-group">
                    <label for="create_password">Modpas (Opsyonèl)</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="create_password" class="form-control" placeholder="Kite vid si w pa vle modpas">
                    </div>
                </div>
                
                <button class="konf-btn konf-btn-primary" onclick="createRoom()">
                    <i class="fas fa-plus-circle"></i> Kreye Sal
                </button>

                <div class="konf-divider">
                    <span>OSWA</span>
                </div>

                <!-- Join Room Section -->
                <div class="konferans-section-title">
                    <i class="fas fa-sign-in-alt"></i> Antre nan yon Sal
                </div>
                
                <div class="konf-form-group">
                    <label for="join_room_code">Kòd Sal la</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-key"></i>
                        <input type="text" id="join_room_code" class="form-control" placeholder="Egz: AB1234">
                    </div>
                </div>
                
                <div class="konf-form-group">
                    <label for="join_user_name">Non w</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="join_user_name" class="form-control" placeholder="Egz: Jean Philippe">
                    </div>
                </div>
                
                <div class="konf-form-group">
                    <label for="join_password">Modpas (Si genyen)</label>
                    <div class="konf-input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="join_password" class="form-control" placeholder="Antre modpas sal la">
                    </div>
                </div>
                
                <button class="konf-btn konf-btn-success" onclick="joinRoom()">
                    <i class="fas fa-sign-in-alt"></i> Antre nan Sal
                </button>

                <!-- Features -->
                <div class="konf-features">
                    <div class="konf-feature-item">
                        <i class="fas fa-shield-alt"></i>
                        <span>Ankripte</span>
                    </div>
                    <div class="konf-feature-item">
                        <i class="fas fa-users"></i>
                        <span>Plizyè Patisipan</span>
                    </div>
                    <div class="konf-feature-item">
                        <i class="fas fa-mobile-alt"></i>
                        <span>Mobil & Desktop</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Get CSRF token from meta tag
    function getCSRFToken() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        return meta ? meta.getAttribute('content') : '';
    }

    async function createRoom() {
        const roomName = document.getElementById('create_room_name').value;
        const creatorName = document.getElementById('create_user_name').value;
        const password = document.getElementById('create_password').value;

        if (!roomName || !creatorName) {
            alert('Tanpri ranpli non sal la ak non w.');
            return;
        }

        try {
            const response = await fetch('/konferans/create_room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                    room_name: roomName,
                    creator_name: creatorName,
                    password: password
                })
            });

            const data = await response.json();
            if (data.success) {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = `/konferans/room/${data.room_code}?user_name=${encodeURIComponent(creatorName)}`;
                }
            } else {
                alert(data.error || 'Erè nan kreasyon sal la.');
            }
        } catch (err) {
            console.error(err);
            alert('Yon erè rive. Eseye ankò.');
        }
    }

    async function joinRoom() {
        const roomCode = document.getElementById('join_room_code').value.toUpperCase();
        const userName = document.getElementById('join_user_name').value;
        const password = document.getElementById('join_password').value;

        if (!roomCode || !userName) {
            alert('Tanpri ranpli kòd sal la ak non w.');
            return;
        }

        try {
            const response = await fetch('/konferans/join_room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                    room_code: roomCode,
                    user_name: userName,
                    password: password
                })
            });

            const data = await response.json();
            if (data.success) {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = `/konferans/room/${roomCode}?user_name=${encodeURIComponent(userName)}`;
                }
            } else {
                alert(data.error || 'Erè nan antre nan sal la.');
            }
        } catch (err) {
            console.error(err);
            alert('Yon erè rive. Eseye ankò.');
        }
    }
</script>
{% endblock %}
