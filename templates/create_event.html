<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreye Evènman - Glory2yahPub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/video-enhancements.css') }}">
    <style>
        .create-event-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .event-form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload-label:hover {
            border-color: #3498db;
            background: #ecf0f1;
        }

        .file-upload-label i {
            font-size: 24px;
            color: #7f8c8d;
            margin-right: 10px;
        }

        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #27ae60;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            color: white;
        }

        .required {
            color: #e74c3c;
        }

        @media (max-width: 768px) {
            .create-event-container {
                padding: 10px;
            }

            .event-form {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="create-event-container">
        <div class="form-header">
            <h1>📅 Kreye Nouvo Evènman</h1>
            <p>Ranpli enfòmasyon evènman ou an pou kòmanse planifye</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'error' if category == 'error' else 'warning' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="eventForm" class="event-form">
            <div class="form-group">
                <label for="title" class="form-label">
                    Tit Evènman <span class="required">*</span>
                </label>
                <input type="text" id="title" name="title" class="form-control" required
                       placeholder="Eg: Fèt Anivèsè Mariage">
            </div>

            <div class="form-group">
                <label for="description" class="form-label">
                    Deskripsyon <span class="required">*</span>
                </label>
                <textarea id="description" name="description" class="form-control form-textarea" required
                          placeholder="Dekri evènman ou an detay..."></textarea>
            </div>

            <div class="form-group">
                <label for="date_time" class="form-label">
                    Dat ak Lè <span class="required">*</span>
                </label>
                <input type="datetime-local" id="date_time" name="date_time" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="location" class="form-label">
                    Kote <span class="required">*</span>
                </label>
                <input type="text" id="location" name="location" class="form-control" required
                       placeholder="Eg: Hotel Karibe, Pòtoprens">
            </div>

            <div class="form-group">
                <label for="telephone" class="form-label">
                    Nimewo Telefòn <span class="required">*</span>
                </label>
                <input type="tel" id="telephone" name="telephone" class="form-control" required
                       placeholder="Eg: +50942882076">
            </div>

            <div class="form-group">
                <label for="cover_image" class="form-label">
                    Imaj Kouvèti (Opsyonèl)
                </label>
                <div class="file-upload">
                    <input type="file" id="cover_image" name="cover_image" accept="image/*">
                    <div class="file-upload-label">
                        <i>📷</i>
                        <span>Klike pou chwazi yon imaj</span>
                    </div>
                </div>
                <div id="file-name" class="file-name" style="display: none;"></div>
            </div>

            <div class="form-actions">
                <button type="button" onclick="sendToWhatsApp()" class="btn btn-primary">
                    📱 Voye sou WhatsApp
                </button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                    ❌ Anile
                </a>
            </div>
        </form>
    </div>

    <script>
        // File upload preview
        document.getElementById('cover_image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileNameDiv = document.getElementById('file-name');

            if (file) {
                fileNameDiv.textContent = 'Fichye chwazi: ' + file.name;
                fileNameDiv.style.display = 'block';
            } else {
                fileNameDiv.style.display = 'none';
            }
        });

        // Send form data to WhatsApp
        function sendToWhatsApp() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const dateTime = document.getElementById('date_time').value;
            const location = document.getElementById('location').value;
            const telephone = document.getElementById('telephone').value;

            // Basic validation
            if (!title || !description || !dateTime || !location || !telephone) {
                alert('Tanpri ranpli tout enfòmasyon obligatwa yo.');
                return;
            }

            // Format the message
            const message = `📅 Nouvo Evènman\n\n` +
                          `Tit: ${title}\n` +
                          `Deskripsyon: ${description}\n` +
                          `Dat ak Lè: ${dateTime}\n` +
                          `Kote: ${location}\n` +
                          `Telefòn: ${telephone}\n\n` +
                          `Mèsi pou konsidere evènman sa a!`;

            // Encode the message for WhatsApp URL
            const encodedMessage = encodeURIComponent(message);

            // WhatsApp URL (you can change the phone number)
            const whatsappUrl = `https://wa.me/50942882076?text=${encodedMessage}`;

            // Open WhatsApp
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
