{% extends "ecole_biblique/eb_base.html" %}

{% block eb_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Enskripsyon</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Non Konplè</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="whatsapp" class="form-label">Nimewo WhatsApp</label>
                        <input type="text" class="form-control" id="whatsapp" name="whatsapp" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Modpas</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Wòl</label>
                        <select class="form-control" id="role" name="role" required>
                            <option value="student">Elèv</option>
                            <option value="teacher">Pwofesè</option>
                            <option value="admin">Administratè</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Enskri</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
