{% extends "ecole_biblique/eb_base.html" %}

{% block eb_content %}
<h2>Teacher Dashboard</h2>

<h3>My Courses</h3>
<ul class="list-group mb-4">
    {% for course in courses %}
        <li class="list-group-item">
            {{ course.name }}
            <a href="#" class="btn btn-sm btn-primary float-end">Manage Grades</a>
        </li>
    {% endfor %}
</ul>

<h3>Enter Grades</h3>
<form id="grade-form">
    <div class="mb-3">
        <label for="course" class="form-label">Course</label>
        <select class="form-select" id="course" name="course" required>
            {% for course in courses %}
                <option value="{{ course.id }}">{{ course.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="student" class="form-label">Student</label>
        <select class="form-select" id="student" name="student" required>
            <!-- Populated dynamically -->
        </select>
    </div>
    <div class="mb-3">
        <label for="assignments" class="form-label">Assignments Average</label>
        <input type="number" step="0.01" class="form-control" id="assignments" name="assignments">
    </div>
    <div class="mb-3">
        <label for="exam" class="form-label">Exam Grade</label>
        <input type="number" step="0.01" class="form-control" id="exam" name="exam">
    </div>
    <button type="submit" class="btn btn-success">Save Grade</button>
</form>

<table class="table table-striped mt-4" id="grades-table">
    <thead>
        <tr>
            <th>Student</th>
            <th>Assignments</th>
            <th>Exam</th>
            <th>Average</th>
        </tr>
    </thead>
    <tbody>
        <!-- Populated by JS -->
    </tbody>
</table>

{% endblock %}
