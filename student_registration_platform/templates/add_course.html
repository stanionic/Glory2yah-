{% extends "base.html" %}

{% block title %}Ajouter un Cours{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center mb-0">
                        <i class="fas fa-plus me-2"></i>Ajouter un Nouveau Cours
                    </h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nom du Cours *</label>
                            <input type="text" class="form-control" id="name" name="name"
                                   placeholder="Ex: Cours de Mathématiques" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" name="description"
                                      rows="4" placeholder="Décrivez le contenu du cours..." required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="duration" class="form-label">Durée *</label>
                                <input type="text" class="form-control" id="duration" name="duration"
                                       placeholder="Ex: 3 mois, 6 semaines" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fee" class="form-label">Frais d'Inscription (HTG) *</label>
                                <input type="number" class="form-control" id="fee" name="fee"
                                       placeholder="Ex: 5000" step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save me-2"></i>Ajouter le Cours
                            </button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Retour au Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
