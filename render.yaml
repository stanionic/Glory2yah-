services:
  - type: web
    name: glory2yahpub
    runtime: python3
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      # Mutable/persistent directories on the Render disk (mountPath: /opt/render/project/src/instance)
      mkdir -p instance
      mkdir -p instance/uploads
      mkdir -p instance/.flask_session
      mkdir -p instance/logs
      # E-LEARNING PHASE 2+ : recordings of live lessons + student submission files
      # also live on the persistent disk so they are NOT wiped between deploys.
      mkdir -p instance/recordings
      mkdir -p instance/submissions
      # Legacy upload dir (symlink target compatibility; also created for safety)
      mkdir -p static/uploads
      mkdir -p .flask_session
      mkdir -p logs
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120 --log-level info
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_WHATSAPP
        value: +50942882076
      # DATABASE_URL is injected automatically by Render from the managed
      # PostgreSQL instance. The app normalizes the legacy `postgres://` scheme
      # to `postgresql://` at startup, so no edit is required here.
      # Optional: set DATABASE_SSLMODE=require if you switch to the database's
      # EXTERNAL connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: glory2yahpub-db
          property: connectionString
      # RENDER PERSISTENCE FIX: explicit path so uploads hit the 1GB persistent disk.
      # Previously uploads went to static/uploads/ inside the ephemeral build container → wiped on every commit/deploy.
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/instance/uploads
      # Sessions also on persistent disk (users stay logged-in across deploys):
      - key: SESSION_FILE_DIR
        value: /opt/render/project/src/instance/.flask_session
      # Logs kept between deploys for debugging:
      - key: LOG_DIR
        value: /opt/render/project/src/instance/logs
      # E-LEARNING PHASE 2+ : persistent locations for lesson recordings (produced
      # by Konferans recording engine) and student submissions files. Stored on
      # the persistent disk at mountPath instance/ (see disk: section below).
      - key: RECORDING_DIR
        value: /opt/render/project/src/instance/recordings
      - key: SUBMISSION_DIR
        value: /opt/render/project/src/instance/submissions
    disk:
      name: glory2yahpub-disk
      mountPath: /opt/render/project/src/instance
      sizeGB: 1

databases:
  - name: glory2yahpub-db
    databaseName: glory2yahpub
    user: glory2yahpub
