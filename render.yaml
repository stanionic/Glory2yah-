services:
  - type: web
    name: glory2yahpub
    runtime: python3
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      # Mutable/persistent directories on the Render disk (mountPath: /opt/render/project/src/instance)
      mkdir -p instance
      mkdir -p instance/uploads
      mkdir -p instance/.flask_session
      mkdir -p instance/logs
      # E-LEARNING PHASE 2+ : recordings of live lessons + student submission files
      # also live on the persistent disk so they are NOT wiped between deploys.
      mkdir -p instance/recordings
      mkdir -p instance/submissions
      # ================================================================
      # PERSISTENCE / IMAGE-LOADING FIX (CRITICAL):
      #   Flask's built-in static handler serves <static_folder>/<path>.
      #   All our templates reference uploaded media via hardcoded
      #   "/static/uploads/<filename>" or url_for('static', filename='uploads/X').
      #   BUT actual user uploads live on the persistent disk at
      #   instance/uploads (UPLOAD_FOLDER env), NOT inside static/uploads
      #   (which lives on the EPHEMERAL build container and is WIPED on
      #   every deploy / commit).
      #
      # FIX: Replace the empty static/uploads directory with a SYMLINK
      # pointing at the persistent-disk uploads folder. This makes:
      #   (a) Flask's native static handler serve the real files correctly.
      #   (b) The before_request fallback layer catch any remaining edge
      #       cases (e.g. a symlink not created / broken in a new deploy).
      #   (c) User-uploaded images survive 100% of git commits / pushes /
      #       container rebuilds (because the *target* of the symlink is
      #       the persistent Render disk at mountPath /opt/render/project/src/instance).
      # ================================================================
      rm -rf static/uploads
      ln -sfn /opt/render/project/src/instance/uploads static/uploads
      # Also symlink legacy session/log dirs (compatibility / debug)
      mkdir -p .flask_session
      mkdir -p logs
      ln -sfn /opt/render/project/src/instance/.flask_session .flask_session || true
      ln -sfn /opt/render/project/src/instance/logs logs || true
      # Legacy upload dir (symlink target compatibility; also created for safety)
      mkdir -p static/uploads
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120 --log-level info
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      # SECRET_KEY signs sessions + CSRF tokens. `generateValue: true` only
      # generates a value ONCE (at first sync) and then keeps it stable across
      # redeploys — it does NOT change on every deploy. Keeping generateValue
      # here is safe: sessions and CSRF tokens survive redeploys. If you ever
      # recreate the service, the key changes once and all sessions/CSRF tokens
      # invalidate a single time (users just reload and log in again).
      - key: SECRET_KEY
        generateValue: true
      # ADMIN_PASSWORD: a KNOWN, stable value (do NOT use generateValue here —
      # that produced a random password nobody could log in with). Change this
      # to your own strong password. On first boot the admin is created with it.
      - key: ADMIN_PASSWORD
        value: StanGlory2YahPub1986
      # BREAK-GLASS admin recovery: when set to 1, the app force-resets the
      # admin password to ADMIN_PASSWORD on that boot (use once to regain access
      # if the password was ever lost), then persists normally. Leave at 0 for
      # everyday operation so the admin password is never auto-reset.
      - key: ADMIN_PASSWORD_RESET
        value: "0"
      - key: ADMIN_WHATSAPP
        value: +50942882076
      # ================================================================
      # WHATSAPP ADMIN NOTIFICATIONS via CallMeBot (ENABLED).
      #   notification_service.py reads these directly from os.environ:
      #   - ADMIN_WHATSAPP_ALERTS = master switch (default 1). "0" silences
      #     outbound WhatsApp; alerts still land in the admin notification centre.
      #   - CALLMEBOT_APIKEY is the FIRST provider tried in the chain
      #     (callmebot -> ultramsg -> whatsapp_cloud -> webhook). It is a SECRET,
      #     so it is NOT hard-coded here (that would leak it into Git history).
      #     `sync: false` makes Render prompt for the value in the Dashboard:
      #     paste your real CallMeBot key there ONCE. Without a value, the
      #     provider returns None and WhatsApp sending is silently skipped.
      #   Register/obtain the key (one time) at callmebot.com free WhatsApp API.
      # ================================================================
      - key: ADMIN_WHATSAPP_ALERTS
        value: "1"
      - key: CALLMEBOT_APIKEY
        sync: false
      # DATABASE_URL is injected automatically by Render from the managed
      # PostgreSQL instance. The app normalizes the legacy `postgres://` scheme
      # to `postgresql://` at startup, so no edit is required here.
      # Optional: set DATABASE_SSLMODE=require if you switch to the database's
      # EXTERNAL connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: glory2yahpub-db
          property: connectionString
      # REDIS (production cache + rate-limit backend). Injected from the managed
      # Key Value instance below via Render's private network. The app pings it on
      # boot; with a real URL present it enables Redis caching + flask-limiter
      # storage instead of the localhost/DB-only fallback. Format injected:
      #   redis://red-xxxxxxxx:6379  (auth user:pass included if internal auth is on)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glory2yahpub-redis
          property: connectionString
      # RENDER PERSISTENCE FIX: explicit path so uploads hit the 1GB persistent disk.
      # Previously uploads went to static/uploads/ inside the ephemeral build container → wiped on every commit/deploy.
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/instance/uploads
      # Sessions also on persistent disk (users stay logged-in across deploys):
      - key: SESSION_FILE_DIR
        value: /opt/render/project/src/instance/.flask_session
      # Logs kept between deploys for debugging:
      - key: LOG_DIR
        value: /opt/render/project/src/instance/logs
      # E-LEARNING PHASE 2+ : persistent locations for lesson recordings (produced
      # by Konferans recording engine) and student submissions files. Stored on
      # the persistent disk at mountPath instance/ (see disk: section below).
      - key: RECORDING_DIR
        value: /opt/render/project/src/instance/recordings
      - key: SUBMISSION_DIR
        value: /opt/render/project/src/instance/submissions
    disk:
      name: glory2yahpub-disk
      mountPath: /opt/render/project/src/instance
      sizeGB: 1

  # ================================================================
  # REDIS / Key Value instance (cache + rate-limit backend for the web
  # service). ipAllowList: [] => reachable ONLY over Render's internal
  # private network (the web service connects via the REDIS_URL injected
  # above). Free plan = up to 25MB RAM, no persistence (fine for cache +
  # limiter; sessions stay on the persistent filesystem disk).
  # ================================================================
  - type: keyvalue
    name: glory2yahpub-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: glory2yahpub-db
    databaseName: glory2yahpub
    user: glory2yahpub
