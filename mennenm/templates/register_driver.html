{% extends "base.html" %}
{% block content %}

<h3>🧑‍✈️ Inscription Chauffeur</h3>

<form method="POST" enctype="multipart/form-data">
    <input name="name" placeholder="Nom complet" required><br><br>
    <input name="phone" placeholder="WhatsApp" required><br><br>
    <input name="address" placeholder="Adresse" required><br><br>
    <input type="file" name="photo" required><br><br>

    <button><i class="fa fa-save"></i></button>
</form>

{% endblock %}
