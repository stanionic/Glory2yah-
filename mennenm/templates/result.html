{% extends "base.html" %}
{% block content %}

<h3>🚕 Chauffeur le plus proche</h3>

<img src="/static/uploads/{{ driver.photo }}" width="200"><br>
<b>{{ driver.name }}</b><br><br>

<a href="https://wa.me/{{ driver.phone.replace('+','') }}">
    <button style="background:green;color:white;">
        <i class="fa-brands fa-whatsapp"></i>
    </button>
</a>

<div id="map" style="height:300px;margin-top:20px;"></div>

<script>
var map = L.map('map').setView([{{ client_lat }}, {{ client_lon }}], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

L.marker([{{ client_lat }}, {{ client_lon }}]).addTo(map).bindPopup("Client");
L.marker([{{ driver.lat }}, {{ driver.lon }}]).addTo(map).bindPopup("Chauffeur");
</script>

{% endblock %}
