{% extends "base.html" %}

{% block head %}
<title>Konferans - Glory2YahPub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    /* Correction pour l'affichage avec la navbar globale */
    header .container {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
    }
</style>
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h3><i class="fas fa-video"></i> Konferans - Konferans Videyo</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Kreye Yon Nouvo Sal</h5>
                                <form id="createRoomForm">
                                    <div class="mb-3">
                                        <label for="roomName" class="form-label">Non Sal</label>
                                        <input type="text" class="form-control" id="roomName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="creatorName" class="form-label">Non Ou</label>
                                        <input type="text" class="form-control" id="creatorName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Modpas (Opsyonèl)</label>
                                        <input type="password" class="form-control" id="password">
                                    </div>
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-plus"></i> Kreye Sal
                                    </button>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <h5>Antre nan Sal Ki Egziste Deja</h5>
                                <form id="joinRoomForm">
                                    <div class="mb-3">
                                        <label for="roomCode" class="form-label">Ekriven</label>
                                        <input type="text" class="form-control" id="roomCode" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="userName" class="form-label">Non Ou</label>
                                        <input type="text" class="form-control" id="userName" required>
                                    </div>
                                    <div class="mb-3" id="passwordField" style="display: none;">
                                        <label for="joinPassword" class="form-label">Modpas</label>
                                        <input type="password" class="form-control" id="joinPassword">
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-sign-in-alt"></i> Antre nan Sal
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Create room form handler
        document.getElementById('createRoomForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const roomName = document.getElementById('roomName').value;
            const creatorName = document.getElementById('creatorName').value;
            const password = document.getElementById('password').value;

            fetch('/konferans/create_room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    room_name: roomName,
                    creator_name: creatorName,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = `/konferans/room/${data.room_code}?user_name=${encodeURIComponent(creatorName)}`;
                } else {
                    alert('Erè: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Erè nan kreasyon sal la');
            });
        });

        // Join room form handler
        document.getElementById('joinRoomForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const roomCode = document.getElementById('roomCode').value.toUpperCase();
            const userName = document.getElementById('userName').value;
            const password = document.getElementById('joinPassword').value;

            fetch('/konferans/join_room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    room_code: roomCode,
                    user_name: userName,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = `/konferans/room/${data.room_code}?user_name=${encodeURIComponent(userName)}`;
                } else {
                    alert('Erè: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Erè nan antre nan sal la');
            });
        });

        // Check room password requirement
        document.getElementById('roomCode').addEventListener('input', function() {
            const roomCode = this.value.toUpperCase();
            if (roomCode.length === 6) {
                fetch(`/konferans/check_room/${roomCode}`)
                .then(response => response.json())
                .then(data => {
                    const passwordField = document.getElementById('passwordField');
                    if (data.exists && data.has_password) {
                        passwordField.style.display = 'block';
                        document.getElementById('joinPassword').required = true;
                    } else {
                        passwordField.style.display = 'none';
                        document.getElementById('joinPassword').required = false;
                    }
                })
                .catch(error => {
                    console.error('Error checking room:', error);
                });
            }
        });
    </script>
{% endblock %}
