{% extends "ecole_biblique/eb_base.html" %}
{% block eb_content %}
<div class="login-page" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
    <div class="login-card" style="background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 32px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); width: 100%; max-width: 420px; padding: 40px 30px; animation: fadeInUp 0.6s ease;">
        <div class="login-header" style="text-align: center; margin-bottom: 36px;">
            <div class="login-logo" style="width: 80px; height: 80px; margin: 0 auto 16px; background: linear-gradient(135deg, #1a3a5c 0%, #2a5a8c 100%); border-radius: 24px; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: 0 8px 24px rgba(26, 58, 92, 0.3);">🎓</div>
            <h1 class="login-title" style="font-size: 28px; font-weight: 800; color: #1a1a1a; margin: 0 0 8px;">Konekte Lekòl Biblik</h1>
            <p class="login-subtitle" style="font-size: 15px; color: #65676b; margin: 0;">Ou dwe konekte ak kont Glory2YahPub ou</p>
        </div>
        <div style="text-align: center; padding: 20px 0;">
            <p style="font-size: 16px; color: #1a1a1a; margin-bottom: 24px;">Konekte ak kont ou pou jwenn aksè nan Lekòl Biblik la.</p>
            <a href="{{ url_for('auth.login') }}" class="login-button" style="display: inline-block; width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: white; background: linear-gradient(135deg, #1a3a5c 0%, #2a5a8c 100%); border: none; border-radius: 16px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(26, 58, 92, 0.3); box-sizing: border-box;">Konekte kounye a</a>
        </div>
        <div class="register-prompt" style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid #f0f2f5;">
            <p class="register-prompt-text" style="font-size: 14px; color: #65676b; margin: 0;">
                Ou pa gen kont?
                <a href="{{ url_for('auth.register') }}" class="register-link" style="font-weight: 700; color: #1a3a5c; text-decoration: none; transition: all 0.2s ease;">Kreye yon kont gratis</a>
            </p>
        </div>
    </div>
</div>
<style>
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.login-button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(26, 58, 92, 0.4); }
.login-button:active { transform: translateY(0); }
.register-link:hover { color: #2a5a8c; text-decoration: underline; }
@media (max-width: 480px) { .login-card { padding: 32px 24px; border-radius: 24px; } .login-title { font-size: 24px; } }
</style>
{% endblock %}
